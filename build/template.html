<title>Botillería Voy y Vuelvo · Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  --ground:#F6F5F4; --surface:#FFFFFF; --ink:#1C1A1A; --muted:#625C5A; --line:#E4E0DE;
  --brand:#CD212A; --wine:#CD212A; --onbrand:#FFFFFF;
  --tag:#1C1A1A; --tag-ink:#FFFFFF; --kicker:#FFFFFF; --age:#1C1A1A; --age-ink:#FFFFFF;
  --plate:#1C1A1A; --plate-kicker:#FF6B73;
  --logo-bg:#FFFFFF; --logo-ar:#1C1A1A; --logo-bt:#CD212A; --logo-ls:#1C1A1A;
  --chip:#FFFFFF; --chip-on:#1C1A1A; --chip-on-ink:#FFFFFF;
  --photo:#FFFFFF; --noimg:#F1EFEE; --noimg-ink:#B81D26; --note:#EFECEA; --note-ink:#1C1A1A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121111; --surface:#1D1B1B; --ink:#F2EFEE; --muted:#ADA6A4; --line:#322E2D;
    --brand:#FF4D57; --wine:#B01C24; --onbrand:#FFFFFF;
    --tag:#F2EFEE; --tag-ink:#121111; --kicker:#FFFFFF; --age:#121111; --age-ink:#FFFFFF;
    --plate:#121111; --plate-kicker:#FF7A82;
    --logo-bg:#FFFFFF; --logo-ar:#121111; --logo-bt:#CD212A; --logo-ls:#121111;
    --chip:#1D1B1B; --chip-on:#F2EFEE; --chip-on-ink:#121111;
    --photo:#FFFFFF; --noimg:#272424; --noimg-ink:#FF9CA2; --note:#2A2727; --note-ink:#E8E3E1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121111; --surface:#1D1B1B; --ink:#F2EFEE; --muted:#ADA6A4; --line:#322E2D;
  --brand:#FF4D57; --wine:#B01C24; --onbrand:#FFFFFF;
  --tag:#F2EFEE; --tag-ink:#121111; --kicker:#FFFFFF; --age:#121111; --age-ink:#FFFFFF;
  --plate:#121111; --plate-kicker:#FF7A82;
  --logo-bg:#FFFFFF; --logo-ar:#121111; --logo-bt:#CD212A; --logo-ls:#121111;
  --chip:#1D1B1B; --chip-on:#F2EFEE; --chip-on-ink:#121111;
  --photo:#FFFFFF; --noimg:#272424; --noimg-ink:#FF9CA2; --note:#2A2727; --note-ink:#E8E3E1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
.mast{background:var(--wine);color:var(--onbrand)}
.mast-in{max-width:1100px;margin:0 auto;padding:14px 16px 12px;display:grid;gap:12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;margin:0;min-width:0;background:var(--plate);padding:7px 18px 7px 7px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16),0 4px 12px rgba(0,0,0,.22)}
.logo{width:52px;height:52px;flex:0 0 auto}
.lg-bg{fill:var(--logo-bg)}.lg-ar{stroke:var(--logo-ar);stroke-width:3.6;stroke-linecap:round}.lg-ah{fill:var(--logo-ar)}.lg-bt{fill:var(--logo-bt)}.lg-lb{fill:var(--logo-bg)}.lg-ls{fill:var(--logo-ls)}
.brand-tx{display:grid;gap:3px;min-width:0}
.kicker{font:700 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--plate-kicker);line-height:1}
.name-big{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.3px;line-height:.95;white-space:nowrap}
.count{font-size:13px;opacity:.85;white-space:nowrap;align-self:flex-end}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0;padding:0;list-style:none}
.facts li{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--body);padding:5px 10px 5px 8px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.facts svg{width:15px;height:15px;flex:0 0 auto;color:var(--kicker)}
.facts .age{background:var(--age);color:var(--age-ink);border-color:var(--age);font-weight:600}
.facts .age b{font:700 12px var(--body);background:var(--age-ink);color:var(--age);border-radius:999px;padding:2px 5px;letter-spacing:0}
@media (max-width:420px){.logo{width:44px;height:44px}.name-big{font-size:28px}.kicker{font-size:11px;letter-spacing:2.4px}.facts li{font-size:12px}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wine);color:var(--onbrand);box-shadow:0 6px 10px -4px rgba(0,0,0,.28)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px 10px}
.search{position:relative}
.search input{width:100%;font:500 16px var(--body);padding:11px 40px 11px 40px;border-radius:10px;border:0;background:#fff;color:#1F1416;outline:none}
.search input:focus-visible{box-shadow:0 0 0 3px var(--tag)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#8a7a7c}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font:600 20px var(--body);color:#8a7a7c;width:32px;height:32px;border-radius:8px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--onbrand);font:600 14px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.chip:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.section{margin:18px 0 8px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.2px;display:flex;align-items:baseline;gap:8px;text-wrap:balance}
.section small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center;max-width:100%}
.photo img{width:100%;height:100%;object-fit:contain;padding:8px}
.noimg{background:var(--noimg);color:var(--noimg-ink);display:grid;place-items:center;text-align:center;gap:6px}
.noimg b{font-family:var(--display);font-size:34px;line-height:1}
.noimg span{font-size:12px;font-weight:600;opacity:.8}
.info{padding:9px 10px 0;flex:1}
.name{font-weight:600;font-size:14.5px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{margin:10px 0 0;background:var(--tag);color:var(--tag-ink);padding:6px 10px 7px;display:grid;gap:1px;position:relative}
.tag:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand)}
.price{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.price .u{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:0;margin-left:4px}
.pack{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pack em{font-style:normal;font-weight:500;opacity:.8}
.noprice{font-family:var(--display);font-weight:700;font-size:20px}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 28px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.985)}}
</style>

<div class="mast">
  <div class="mast-in">
    <div class="brandrow">
      <h1 class="brand"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Botillería Voy y Vuelvo"><circle class="lg-bg" cx="32" cy="32" r="31"/><path d="M14.38 46.78A23 23 0 0 1 12.93 19.14" class="lg-ar" fill="none" stroke-width="3.6" stroke-linecap="round"/><path d="M8.37 16.06L16.56 13.75L17.49 22.22Z" class="lg-ah"/><path d="M49.62 17.22A23 23 0 0 1 51.07 44.86" class="lg-ar" fill="none" stroke-width="3.6" stroke-linecap="round"/><path d="M55.63 47.94L47.44 50.25L46.51 41.78Z" class="lg-ah"/><path class="lg-bt" d="M29.6 9.5h4.8v2.2h-.6v7.6c0 1.6.9 2.7 2.4 4 1.6 1.4 2.6 3 2.6 5.4V50c0 1.7-1.3 3-3 3h-7.6c-1.7 0-3-1.3-3-3V28.7c0-2.4 1-4 2.6-5.4 1.5-1.3 2.4-2.4 2.4-4v-7.6h-.6Z"/><rect x="25.4" y="35" width="13.2" height="8" class="lg-lb"/><rect x="25.4" y="37.2" width="13.2" height="3.6" class="lg-ls"/></svg><span class="brand-tx"><span class="kicker">Botillería</span><span class="name-big">Voy y Vuelvo</span></span></h1>
      <div class="count" id="count"></div>

      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>San Antonio · 2 locales</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Tarjeta y efectivo</li>

</div>
<header class="top">
  <div class="top-in">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar: coca 3 litros, royal, pisco…" autocomplete="off" aria-label="Buscar producto">

<script type="application/json" id="catalogo">__DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('catalogo').textContent);
  const ORDER = ["Cervezas","Vinos y espumantes","Piscos","Whisky","Ron, vodka, gin y licores","Cócteles y listos para tomar","Bebidas","Aguas","Jugos, néctares y té","Energéticas e isotónicas","Cigarros y vapes","Snacks y frutos secos","Dulces, galletas y chocolates","Helados","Lácteos","Panadería","Abarrotes","Congelados y cecinas","Limpieza y aseo","Otros"];
  const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/,/g,'.');
  const cats = ORDER.filter(c => DATA.some(p => p.c === c));
  DATA.forEach(p => { p._s = norm(p.n + ' ' + p.c); });
  let cat = 'Todo', q = '';
  try { const saved = localStorage.getItem('vyv-cat'); if (saved && (saved==='Todo' || cats.includes(saved))) cat = saved; } catch(e){}
  const chips = document.getElementById('chips'), list = document.getElementById('list');
  const input = document.getElementById('q'), clear = document.getElementById('clear'), count = document.getElementById('count');

  function renderChips(){
    chips.innerHTML = '';
    ['Todo', ...cats].forEach(c => {
      const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c;
      b.setAttribute('aria-pressed', String(c===cat));
      b.onclick = () => { cat = c; try{localStorage.setItem('vyv-cat',c)}catch(e){}; renderChips(); render(); window.scrollTo({top:0}); };
      chips.appendChild(b);
    });
  }
  function initials(c){ return c.split(/[\s,]+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
  function card(p){
    const el = document.createElement('article'); el.className='card';
    const ph = document.createElement('div');
    if (p.img){ ph.className='photo'; const im=new Image(); im.src=p.img; im.alt=p.n; im.loading='lazy'; im.decoding='async';
      im.onerror=()=>{ ph.className='photo noimg'; ph.innerHTML=''; fill(); }; ph.appendChild(im); }
    else { ph.className='photo noimg'; fill(); }
    function fill(){ const b=document.createElement('b'); b.textContent=initials(p.c); const s=document.createElement('span'); s.textContent='Sin foto'; ph.append(b,s); }
    const info=document.createElement('div'); info.className='info';
    const h=document.createElement('h3'); h.className='name'; h.textContent=p.n; info.appendChild(h);
    const tag=document.createElement('div'); tag.className='tag';
    if (p.p){ const pr=document.createElement('div'); pr.className='price'; pr.textContent=fmt(p.p);
      const u=document.createElement('span'); u.className='u'; u.textContent='c/u'; pr.appendChild(u); tag.appendChild(pr);
      if (p.k && p.kp){ const pk=document.createElement('div'); pk.className='pack';
        pk.innerHTML = 'Pack ' + p.k + ': <strong></strong> <em></em>';
        pk.querySelector('strong').textContent = fmt(p.kp); pk.querySelector('em').textContent = '· ' + fmt(p.kp/p.k) + ' c/u';
        tag.appendChild(pk); }
    } else { const np=document.createElement('div'); np.className='noprice'; np.textContent='Precio por definir'; tag.appendChild(np); }
    el.append(ph, info, tag); return el;
  }
  function render(){
    const terms = norm(q).split(/\s+/).filter(Boolean);
    const hit = DATA.filter(p => (cat==='Todo' || p.c===cat) && terms.every(t => p._s.includes(t)));
    list.innerHTML='';
    count.textContent = hit.length + (hit.length===1?' producto':' productos');
    if (!hit.length){ const e=document.createElement('p'); e.className='empty'; e.textContent='No hay productos que coincidan con «' + q + '». Prueba con otra palabra o elige «Todo».'; list.appendChild(e); return; }
    const groups = (cat==='Todo' ? cats : [cat]).map(c => [c, hit.filter(p=>p.c===c).sort((a,b)=>a.n.localeCompare(b.n,'es'))]).filter(g=>g[1].length);
    groups.forEach(([c,items]) => {
      const h=document.createElement('h2'); h.className='section'; h.textContent=c;
      const sm=document.createElement('small'); sm.textContent=items.length; h.appendChild(sm);
      const g=document.createElement('div'); g.className='grid'; items.forEach(p=>g.appendChild(card(p)));
      list.append(h,g);
    });
  }
  input.addEventListener('input', () => { q=input.value; clear.hidden=!q; render(); });
  clear.addEventListener('click', () => { q=''; input.value=''; clear.hidden=true; input.focus(); render(); });
  renderChips(); render();
})();
</script>
